[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Pinned so the bytecode, and therefore the CREATE2 address, is identical on every chain.
solc_version = "0.8.26"
evm_version = "paris"   # no PUSH0/MCOPY/TSTORE: runs unchanged on Base, HyperEVM, Arc and Robinhood Chain
optimizer = true
optimizer_runs = 200
via_ir = true    # _fees needs it (stack depth); pinned like everything else
bytecode_hash = "ipfs"
cbor_metadata = true
